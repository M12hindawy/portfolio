<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="avatarGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="50%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <filter id="avGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Glowing Base Circle -->
  <circle cx="200" cy="200" r="150" fill="none" stroke="url(#avatarGrad)" stroke-width="3" filter="url(#avGlow)" opacity="0.7"/>
  <circle cx="200" cy="200" r="140" fill="#0b0f19" stroke="url(#avatarGrad)" stroke-width="2"/>
  <!-- Geometric Cube / Neural Core -->
  <g transform="translate(140, 140)">
    <polygon points="60,10 110,40 110,95 60,125 10,95 10,40" fill="none" stroke="#38bdf8" stroke-width="2"/>
    <line x1="60" y1="10" x2="60" y2="70" stroke="#38bdf8" stroke-width="2"/>
    <line x1="110" y1="40" x2="60" y2="70" stroke="#38bdf8" stroke-width="2"/>
    <line x1="10" y1="40" x2="60" y2="70" stroke="#38bdf8" stroke-width="2"/>
    <line x1="60" y1="70" x2="60" y2="125" stroke="#38bdf8" stroke-width="2"/>
    <circle cx="60" cy="70" r="12" fill="#a855f7" filter="url(#avGlow)"/>
  </g>
  <!-- Orbiting Nodes -->
  <circle cx="85" cy="150" r="8" fill="#06b6d4"/>
  <circle cx="315" cy="150" r="8" fill="#3b82f6"/>
  <circle cx="200" cy="60" r="9" fill="#10b981"/>
  <circle cx="200" cy="340" r="9" fill="#f59e0b"/>
  <!-- Connecting Lines -->
  <line x1="85" y1="150" x2="150" y2="180" stroke="#06b6d4" stroke-width="1.5" stroke-dasharray="3"/>
  <line x1="315" y1="150" x2="250" y2="180" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="3"/>
  <line x1="200" y1="60" x2="200" y2="150" stroke="#10b981" stroke-width="1.5" stroke-dasharray="3"/>
  <line x1="200" y1="340" x2="200" y2="265" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="3"/>
</svg>