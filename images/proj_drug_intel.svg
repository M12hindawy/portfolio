<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="100%" height="100%">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#140f28"/>
      <stop offset="50%" stop-color="#1e163d"/>
      <stop offset="100%" stop-color="#0d091a"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <filter id="glow2" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect width="600" height="340" fill="url(#bg2)"/>
  <!-- Molecular Network Connections -->
  <g stroke="#a855f7" stroke-width="1.5" opacity="0.4">
    <line x1="120" y1="120" x2="200" y2="80"/>
    <line x1="200" y1="80" x2="280" y2="130"/>
    <line x1="280" y1="130" x2="240" y2="220"/>
    <line x1="240" y1="220" x2="150" y2="200"/>
    <line x1="150" y1="200" x2="120" y2="120"/>
    <line x1="280" y1="130" x2="380" y2="110"/>
    <line x1="380" y1="110" x2="460" y2="160"/>
    <line x1="460" y1="160" x2="420" y2="240"/>
    <line x1="420" y1="240" x2="330" y2="230"/>
  </g>
  <!-- Nodes -->
  <circle cx="120" cy="120" r="16" fill="#ec4899" filter="url(#glow2)"/>
  <text x="120" y="124" fill="#fff" font-size="10" font-family="'JetBrains Mono', monospace" font-weight="bold" text-anchor="middle">BERT</text>
  <circle cx="200" cy="80" r="14" fill="#8b5cf6"/>
  <circle cx="280" cy="130" r="22" fill="#a855f7" filter="url(#glow2)"/>
  <text x="280" y="135" fill="#fff" font-size="11" font-family="'JetBrains Mono', monospace" font-weight="bold" text-anchor="middle">RAG</text>
  <circle cx="240" cy="220" r="16" fill="#6366f1"/>
  <text x="240" y="224" fill="#fff" font-size="9" font-family="'JetBrains Mono', monospace" font-weight="bold" text-anchor="middle">BiLSTM</text>
  <circle cx="380" cy="110" r="18" fill="#a855f7"/>
  <text x="380" y="114" fill="#fff" font-size="9" font-family="'JetBrains Mono', monospace" font-weight="bold" text-anchor="middle">Chroma</text>
  <circle cx="460" cy="160" r="20" fill="#ec4899" filter="url(#glow2)"/>
  <text x="460" y="164" fill="#fff" font-size="9" font-family="'JetBrains Mono', monospace" font-weight="bold" text-anchor="middle">Flask</text>
  <circle cx="420" cy="240" r="14" fill="#6366f1"/>
  <circle cx="150" cy="200" r="12" fill="#8b5cf6"/>
  <circle cx="330" cy="230" r="14" fill="#ec4899"/>
  <!-- Badge -->
  <rect x="30" y="30" width="220" height="26" rx="13" fill="#831843" opacity="0.3"/>
  <text x="140" y="47" fill="#f472b6" font-size="11" font-family="'JetBrains Mono', monospace" font-weight="bold" text-anchor="middle">💊 PHARMA RAG & DL PLATFORM</text>
  <text x="570" y="47" fill="#a855f7" font-size="11" font-family="'JetBrains Mono', monospace" text-anchor="end">6 DL ARCHITECTURES</text>
</svg>