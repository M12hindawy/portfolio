<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="100%" height="100%">
  <defs>
    <linearGradient id="bg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a192f"/>
      <stop offset="50%" stop-color="#0d213a"/>
      <stop offset="100%" stop-color="#071322"/>
    </linearGradient>
    <linearGradient id="streamGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#3b82f6" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.9"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect width="600" height="340" fill="url(#bg1)"/>
  <g opacity="0.15" stroke="#3b82f6" stroke-width="1">
    <line x1="0" y1="60" x2="600" y2="60"/>
    <line x1="0" y1="120" x2="600" y2="120"/>
    <line x1="0" y1="180" x2="600" y2="180"/>
    <line x1="0" y1="240" x2="600" y2="240"/>
    <line x1="0" y1="300" x2="600" y2="300"/>
    <line x1="100" y1="0" x2="100" y2="340"/>
    <line x1="200" y1="0" x2="200" y2="340"/>
    <line x1="300" y1="0" x2="300" y2="340"/>
    <line x1="400" y1="0" x2="400" y2="340"/>
    <line x1="500" y1="0" x2="500" y2="340"/>
  </g>
  <!-- Streaming curve -->
  <path d="M 30 220 Q 120 80, 220 180 T 420 130 T 570 70" fill="none" stroke="url(#streamGrad)" stroke-width="4" filter="url(#glow)"/>
  <path d="M 30 220 Q 120 80, 220 180 T 420 130 T 570 70 L 570 300 L 30 300 Z" fill="url(#streamGrad)" opacity="0.08"/>
  <!-- Pipeline Nodes -->
  <g transform="translate(70, 160)">
    <rect width="110" height="50" rx="8" fill="#1e293b" stroke="#06b6d4" stroke-width="2"/>
    <text x="55" y="25" fill="#f8fafc" font-size="12" font-family="'JetBrains Mono', monospace" font-weight="bold" text-anchor="middle">KAFKA</text>
    <text x="55" y="40" fill="#94a3b8" font-size="9" font-family="sans-serif" text-anchor="middle">Live Ingestion</text>
  </g>
  <line x1="180" y1="185" x2="240" y2="185" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4"/>
  <g transform="translate(240, 160)">
    <rect width="120" height="50" rx="8" fill="#1e293b" stroke="#f97316" stroke-width="2"/>
    <text x="60" y="25" fill="#f8fafc" font-size="12" font-family="'JetBrains Mono', monospace" font-weight="bold" text-anchor="middle">PYSPARK</text>
    <text x="60" y="40" fill="#94a3b8" font-size="9" font-family="sans-serif" text-anchor="middle">Stream Processing</text>
  </g>
  <line x1="360" y1="185" x2="420" y2="185" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4"/>
  <g transform="translate(420, 160)">
    <rect width="120" height="50" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
    <text x="60" y="25" fill="#f8fafc" font-size="12" font-family="'JetBrains Mono', monospace" font-weight="bold" text-anchor="middle">MINIO + PG</text>
    <text x="60" y="40" fill="#94a3b8" font-size="9" font-family="sans-serif" text-anchor="middle">S3 & Analytical Lake</text>
  </g>
  <!-- Badges top -->
  <rect x="30" y="30" width="180" height="26" rx="13" fill="#0369a1" opacity="0.3"/>
  <text x="120" y="47" fill="#38bdf8" font-size="11" font-family="'JetBrains Mono', monospace" font-weight="bold" text-anchor="middle">⚡ S&P 500 BIG DATA</text>
  <text x="570" y="47" fill="#64748b" font-size="11" font-family="'JetBrains Mono', monospace" text-anchor="end">AIRFLOW ORCHESTRATED</text>
</svg>