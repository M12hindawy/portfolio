<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="100%" height="100%">
  <defs>
    <linearGradient id="bg4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030712"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
  </defs>
  <rect width="600" height="340" fill="url(#bg4)"/>
  <!-- Space Grid HUD -->
  <circle cx="480" cy="180" r="90" fill="none" stroke="#0ea5e9" stroke-width="1" stroke-dasharray="4" opacity="0.3"/>
  <circle cx="480" cy="180" r="60" fill="none" stroke="#0ea5e9" stroke-width="1.5" opacity="0.4"/>
  <circle cx="480" cy="180" r="30" fill="none" stroke="#ef4444" stroke-width="1.5" opacity="0.5"/>
  <!-- 60 FPS ECG Line -->
  <path d="M 30 180 L 130 180 L 140 150 L 150 210 L 160 110 L 175 230 L 185 170 L 195 180 L 290 180 L 300 150 L 310 210 L 320 110 L 335 230 L 345 170 L 355 180 L 450 180" fill="none" stroke="#22c55e" stroke-width="3"/>
  <!-- Telemetry HUD widgets -->
  <g transform="translate(40, 90)">
    <rect width="130" height="60" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1" opacity="0.8"/>
    <text x="15" y="25" fill="#94a3b8" font-size="10" font-family="'JetBrains Mono', monospace">HEART RATE</text>
    <text x="15" y="48" fill="#22c55e" font-size="20" font-family="'JetBrains Mono', monospace" font-weight="bold">72 BPM</text>
  </g>
  <g transform="translate(190, 90)">
    <rect width="130" height="60" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="1" opacity="0.8"/>
    <text x="15" y="25" fill="#94a3b8" font-size="10" font-family="'JetBrains Mono', monospace">MISSION TIME</text>
    <text x="15" y="48" fill="#f59e0b" font-size="18" font-family="'JetBrains Mono', monospace" font-weight="bold">T+ 148d:06h</text>
  </g>
  <rect x="30" y="30" width="240" height="26" rx="13" fill="#1e3a5f" opacity="0.5"/>
  <text x="150" y="47" fill="#38bdf8" font-size="11" font-family="'JetBrains Mono', monospace" font-weight="bold" text-anchor="middle">🚀 NASA SPACE APPS CAIRO</text>
  <text x="570" y="47" fill="#22c55e" font-size="11" font-family="'JetBrains Mono', monospace" text-anchor="end">60 FPS ECG · HL7 FHIR</text>
</svg>